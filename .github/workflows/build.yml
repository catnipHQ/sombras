name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Build
        shell: bash
        run: |
          set +e
          gradle build --console=plain 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then
            # Show the compiler errors as annotations on the run page.
            grep -E "error:|What went wrong|Could not|\.java:[0-9]+" build.log | head -40 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
          fi
          exit $code

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: veritates
          path: build/libs/*.jar
